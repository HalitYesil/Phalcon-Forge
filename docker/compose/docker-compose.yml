services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    depends_on:
      - php
  php:
    build:
      context: ../../
      dockerfile: docker/php/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
    healthcheck:
      test: ["CMD", "php", "-m"]
      interval: 20s
      timeout: 5s
      retries: 3
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
